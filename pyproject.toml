[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "o2t"
version = "0.1.0"
description = "Formally verify LLVM optimization passes from their source: recover intent, prove with Z3, translation-validate real opt."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "al3x3n0" }]
keywords = ["LLVM", "compiler", "compiler-testing", "translation-validation", "formal-verification", "SMT", "z3"]
# Pure-stdlib runtime: the provers are EXTERNAL binaries (Z3, LLVM 18 opt/lli/clang), not pip
# packages -- `o2t doctor` checks for them. So there are no install_requires.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

# `o2t` -- the single front-door command (dispatcher over the tools/cv-*.py shims). After
# `pip install -e .`, `o2t doctor` / `o2t verify` / `o2t list` are on PATH.
[project.scripts]
o2t = "o2t.cli:main"

[project.urls]
Homepage = "https://github.com/al3x3n0/O2T"
Repository = "https://github.com/al3x3n0/O2T"
Issues = "https://github.com/al3x3n0/O2T/issues"

# The loop-verification cluster is now a proper package:
#   o2t.frontend  -- .ll / .cpp ingestion (SCEV via opt, Clang AST, regex legacy)
#   o2t.mine      -- transform miners + relational drivers
#   o2t.synth     -- invariant / relational synthesis (polynomial, coupled, pairing)
#   o2t.prove     -- the Z-discharge provers (induction, cond/geom, memory)
# The tools/cv-*.py files remain as thin CLI shims (so the CMake/gate fixtures are unchanged);
# each bootstraps sys.path and calls the package module's main(). Editable install is optional:
#   pip install -e .
# Legacy underscore helpers (cv_formal_ir, ...) still live in tools/ until a later migration
# pass. The compatibility package remains included so old imports continue to resolve.

[tool.setuptools.packages.find]
include = ["o2t*", "compilerverif*"]
